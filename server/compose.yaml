services:
  plateau:
    build: .
    container_name: plateau-server
    restart: unless-stopped
    ports:
      - "7777:7777/udp"
    environment:
      SERVER_NAME: "Plateau server"
      GAME_MODE: "sandbox"        # or "escape": Escape from Plateau
    volumes:
      - plateau-data:/data

volumes:
  plateau-data:
